[project]
name = "patisserie-catalogue-automatique"
version = "0.1.0"
description = "Application web d'automatisation de catalogue pâtisserie"
readme = "README.md"
requires-python = ">=3.9, <3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "rembg>=2.0.50,<2.0.70",
    "numba>=0.60.0,<0.61.0",
    "opencv-python-headless<4.10",
    "pillow>=10.2.0",
    "openpyxl>=3.1.2",
    "onnxruntime<=1.19.2",
    "numpy<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

